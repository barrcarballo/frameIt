<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tu foto — FrameIt</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:20px; padding:24px; box-sizing:border-box;
         background:#ffdede; font-family:-apple-system,system-ui,sans-serif; }
  img, video { max-width:min(90vw,360px); width:100%; border-radius:16px; box-shadow:0 8px 24px rgba(61,3,3,.25); }

  .view-tabs { display:flex; gap:8px; }
  .view-tabs button {
    font:inherit; font-size:15px; font-weight:600; border:1px solid #3d0303; border-radius:14px;
    padding:8px 18px; cursor:pointer; background:transparent; color:#3d0303;
  }
  .view-tabs button.is-active { background:#3d0303; color:#ffdede; }

  button.action, a.download {
    font:inherit; font-size:18px; font-weight:600; border:none; border-radius:20px;
    padding:14px 28px; cursor:pointer; text-decoration:none; text-align:center; width:min(90vw,320px);
    box-sizing:border-box;
  }
  button.action { background:#3d0303; color:#ffdede; }
  button.action:disabled { opacity:0.6; cursor:default; }
  a.download { background:#950606; color:#ffdede; }
  p.hint { font-size:14px; color:#3d0303; text-align:center; max-width:320px; margin:0; }
</style>
</head>
<body>
  <div class="view-tabs" id="viewTabs" hidden>
    <button type="button" data-view="photo" class="is-active">Foto</button>
    <button type="button" data-view="live">Live</button>
  </div>

  <img id="photo" alt="Tu foto de FrameIt" />
  <video id="live" loop muted autoplay playsinline hidden></video>

  <button class="action" id="shareBtn">Compartir</button>
  <a class="download" id="downloadLink">Descargar foto</a>
  <p class="hint" id="hint"></p>

  <script type="module">
    // Instagram (y la mayoría de las apps) no abren el .webm que graba
    // MediaRecorder en el navegador de la cabina — piden MP4/H.264. En vez
    // de tocar el backend o la cabina, la conversión se hace acá, en el
    // celular, justo antes de compartir: ffmpeg compilado a WebAssembly,
    // cargado solo cuando hace falta (nunca para la foto, ni para
    // simplemente ver/descargar el Live).
    import { FFmpeg } from "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
    import { fetchFile, toBlobURL } from "https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js";

    const params = new URLSearchParams(location.search);
    const photoUrl = params.get("photo");
    const videoUrl = params.get("video");

    const hint = document.getElementById("hint");
    const photoEl = document.getElementById("photo");
    const liveEl = document.getElementById("live");
    const viewTabs = document.getElementById("viewTabs");
    const shareBtn = document.getElementById("shareBtn");
    const downloadLink = document.getElementById("downloadLink");

    let view = "photo";

    function render() {
      photoEl.hidden = view !== "photo";
      liveEl.hidden = view !== "live";
      if (view === "live") liveEl.play().catch(() => {});

      document.querySelectorAll("#viewTabs button").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.view === view);
      });

      downloadLink.href = view === "live" ? videoUrl : photoUrl;
      downloadLink.download = view === "live" ? "frameit-live.webm" : "frameit.png";
      downloadLink.textContent = view === "live" ? "Descargar Live" : "Descargar foto";
    }

    if (!photoUrl) {
      hint.textContent = "No encontramos tu foto. Volvé a escanear el código desde la cabina.";
      shareBtn.hidden = true;
      downloadLink.hidden = true;
    } else {
      photoEl.src = photoUrl;

      if (videoUrl) {
        liveEl.src = videoUrl;
        viewTabs.hidden = false;
        viewTabs.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            view = btn.dataset.view;
            render();
          });
        });
      }

      render();
    }

    // Instancia única de ffmpeg, se carga (~25MB) la primera vez que hace
    // falta convertir un Live y se reusa si se comparte de nuevo.
    let ffmpegPromise = null;

    function getFFmpeg() {
      if (!ffmpegPromise) {
        ffmpegPromise = (async () => {
          const ffmpeg = new FFmpeg();
          const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm";
          await ffmpeg.load({
            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
          });
          return ffmpeg;
        })();
      }
      return ffmpegPromise;
    }

    async function webmToMp4(blob) {
      const ffmpeg = await getFFmpeg();
      await ffmpeg.writeFile("in.webm", await fetchFile(blob));
      await ffmpeg.exec(["-i", "in.webm", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", "-movflags", "+faststart", "out.mp4"]);
      const data = await ffmpeg.readFile("out.mp4");
      return new Blob([data.buffer], { type: "video/mp4" });
    }

    async function shareCurrent() {
      const url = view === "live" ? videoUrl : photoUrl;
      if (!url) return;

      shareBtn.disabled = true;
      hint.textContent = "";

      try {
        const res = await fetch(url);
        const blob = await res.blob();

        let file;
        if (view === "live") {
          hint.textContent = "Convirtiendo video para compartir...";
          try {
            const mp4Blob = await webmToMp4(blob);
            file = new File([mp4Blob], "frameit-live.mp4", { type: "video/mp4" });
          } catch (err) {
            console.warn("[FrameIt] No se pudo convertir el Live a MP4, se comparte en formato original:", err);
            file = new File([blob], "frameit-live.webm", { type: "video/webm" });
          }
          hint.textContent = "";
        } else {
          file = new File([blob], "frameit.png", { type: "image/png" });
        }

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: "FrameIt",
            text: "¡Mirá mi foto de FrameIt! @frameit",
          });
          return;
        }
      } catch (err) {
        if (err.name === "AbortError") return; // el usuario canceló, no es un error
        console.warn("[FrameIt] No se pudo compartir:", err);
      } finally {
        shareBtn.disabled = false;
      }
      hint.textContent =
        "Tu navegador no soporta compartir directo: mantené presionado para guardarlo y compartilo desde tu galería.";
    }

    shareBtn.addEventListener("click", shareCurrent);
  </script>
</body>
</html>
